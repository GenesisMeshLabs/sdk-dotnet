name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write  # NuGet trusted publishing: NuGet/login exchanges the OIDC token
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=main" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $version."
                exit 1
              fi
              # The core's tag must exist, also when its main already names this version.
              if ! git ls-remote --exit-code --tags https://github.com/GenesisMeshLabs/genesismesh.git "refs/tags/v$version" > /dev/null; then
                echo "::error::Genesis Mesh core v$version is not tagged (core main is $core). Release the core first."
                exit 1
              fi
            fi
            echo "Release train verified: $version (core $core)"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Verify release tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-version.ps1 -ReleaseTag "$env:RELEASE_TAG"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The live contract test needs a Network Authority; CI's "Live contract"
      # job runs it. Here it would have nothing to check against.
      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Live" --logger "console;verbosity=normal" --logger trx --results-directory TestResults/unit

      - name: Every target framework ran and passed its tests
        run: python3 scripts/check_trx.py TestResults/unit --project tests/GenesisMesh.Sdk.Tests/GenesisMesh.Sdk.Tests.csproj --min-tests 100

      - name: Pack
        run: dotnet pack src/GenesisMesh.Sdk/GenesisMesh.Sdk.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 7

      # Trusted publishing: NuGet/login exchanges this run's GitHub OIDC token
      # for a short-lived API key, under the trusted publishing policy on
      # nuget.org for this repository and this workflow file (see AGENT.md,
      # "Release process"). It runs when the repository variable NUGET_USER
      # names the nuget.org account that owns the policy. NUGET_API_KEY is
      # only the fallback until that works; then delete the secret and the
      # fallback below.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        env:
          TRUSTED_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$TRUSTED_KEY" ]; then
            KEY="$TRUSTED_KEY"
            echo "Publishing with a short-lived trusted publishing key."
          elif [ -n "$NUGET_API_KEY" ]; then
            KEY="$NUGET_API_KEY"
            echo "::warning::Trusted publishing gave no key (repository variable NUGET_USER and the nuget.org policy); publishing with the NUGET_API_KEY fallback."
          else
            echo "::error::No NuGet key: configure trusted publishing (repository variable NUGET_USER and the nuget.org policy) or the NUGET_API_KEY secret."
            exit 1
          fi
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$KEY" \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || index($0, "## " v " ")) p = 1; next } p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Coordinated Genesis Mesh $tag release." > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
