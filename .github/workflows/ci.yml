name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The merge queue runs the required checks on the merged result.
  merge_group:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package targets net8.0 and net10.0: the .NET 10 SDK builds both
      # (feature band 10.0.4xx, as global.json pins it),
      # and the tests run on both runtimes.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx

      - name: Restore
        run: dotnet restore

      # The code is formatted as dotnet format writes it (.editorconfig).
      - name: Format
        run: dotnet format GenesisMesh.sln --verify-no-changes --no-restore

      - name: Verify release version
        shell: pwsh
        run: ./scripts/check-version.ps1

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=Live" --logger "console;verbosity=normal" --logger trx --results-directory TestResults/unit --collect "XPlat Code Coverage"

      # dotnet test passes when a filter matches nothing and when tests are
      # skipped: every target framework must have run its tests, all passed.
      - name: Every target framework ran and passed its tests
        if: always()
        run: python3 scripts/check_trx.py TestResults/unit --project tests/GenesisMesh.Sdk.Tests/GenesisMesh.Sdk.Tests.csproj --min-tests 100

      # Coverage (coverlet) may not fall: the floors are the coverage when
      # they were set, rounded down. Raise them when coverage rises.
      - name: Coverage floor
        run: >-
          python3 scripts/check_coverage.py TestResults/unit
          --project tests/GenesisMesh.Sdk.Tests/GenesisMesh.Sdk.Tests.csproj
          --line 96 --branch 84
          --file Auth.cs=98 --file Canonical.cs=97 --file StrictJson.cs=97
          --file StrictFields.cs=100 --file OfflineVerifier.cs=92
          --file KeyHistory.cs=94 --file Grants.cs=100 --file Transport.cs=97 --file Metadata.cs=96
          --file Execution.cs=100 --file Clients/EvidenceStoreClient.cs=100

      # Package validation: the public API against the baseline release in
      # the csproj; a removed or changed member fails (see the "API
      # compatibility" job for accepting a break on purpose).
      - name: Pack (package validation)
        run: dotnet pack src/GenesisMesh.Sdk/GenesisMesh.Sdk.csproj --no-build --configuration Release --output artifacts -p:EnablePackageValidation=true

  # Every client method against a running Network Authority: each typed
  # result must model the JSON the NA sent (v1.0.2: most of them did not).
  live-contract:
    name: Live contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # name when it exists, and against main otherwise.
      - name: Choose the core revision
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=main
          if git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$BRANCH" > /dev/null; then ref="$BRANCH"; fi
          echo "Testing with core revision: $ref"
          echo "CORE_REF=$ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GenesisMeshLabs/genesismesh
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./core
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.4xx
      # GM_E2E_REQUIRED=1: the live test fails, rather than passes, when it
      # finds no NA to check against.
      - name: Typed results match a live Network Authority
        run: dotnet test tests/GenesisMesh.Sdk.Tests --configuration Release --filter "Category=Live" --logger "console;verbosity=normal" --logger trx --results-directory TestResults/live
        env:
          GM_E2E_PYTHON: python
          GM_E2E_REQUIRED: "1"
      - name: The live test ran and passed on every target framework
        if: always()
        run: python3 scripts/check_trx.py TestResults/live --project tests/GenesisMesh.Sdk.Tests/GenesisMesh.Sdk.Tests.csproj --only-test EveryCallReturnsWhatTheNASent

  release-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release train (Genesis Mesh core leads every version)
        shell: bash
        run: |
            set -euo pipefail
            if [ -f VERSION ]; then
              version="$(tr -d '[:space:]' < VERSION)"
            else
              version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            fi
            # The contents API is read fresh; raw.githubusercontent.com caches VERSION for minutes after a core merge.
            # A pull request is checked against the core branch of the same name when it
            # exists: the core's release/X.Y.Z while the train's release PRs are open, so
            # they pass together. The core still merges first: a push to main reads the
            # core's main. This workflow does not run on tags; publish.yml checks a tag,
            # which must also match a core tag.
            core_ref=main
            if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads https://github.com/GenesisMeshLabs/genesismesh.git "refs/heads/$GITHUB_HEAD_REF" > /dev/null; then
              core_ref="$GITHUB_HEAD_REF"
            fi
            ref_query="$(jq -rn --arg ref "$core_ref" '$ref | @uri')"
            core="$(curl -fsSL --retry 3 -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/GenesisMeshLabs/genesismesh/contents/VERSION?ref=$ref_query" | tr -d '[:space:]')"
            if [ "$(printf '%s\n%s\n' "$version" "$core" | sort -V | tail -n 1)" != "$core" ]; then
              echo "::error::Version $version is ahead of the Genesis Mesh core ($core). The core leads every coordinated version; see genesismesh docs/development/versioning.md."
              exit 1
            fi
            echo "Release train verified: $version (core $core)"

  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pull requests add changelog.d/<version>/<name>.md; only a release PR
      # (branch release/...) folds them into CHANGELOG.md, so a feature PR for
      # the next version never conflicts with the release of this one.
      - name: Pull requests add fragments; only a release edits CHANGELOG.md
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/changelog.py check ${BASE_REF:+--base origin/$BASE_REF} --branch "$HEAD_REF"
