version: 2
updates:
  # Keeps the commit-pinned actions current; one grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # NuGet packages of the solution (GenesisMesh.sln): the SDK's one runtime
  # dependency (NSec.Cryptography) on its own, the test packages grouped.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      test:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "FsCheck"
          - "coverlet.collector"
